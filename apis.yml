aid: rapattoni

name: Rapattoni

description: Rapattoni Corporation is a California-based provider of multiple listing service (MLS), association management,
  accounting and REALTOR association software for boards and MLSs in the United States. It maintains a developer section on
  rapattoni.com (/dev/) covering its RETS data service and change log and a RESO Web API section for licensed third-party
  data access to MLS listing data. The rapattoni.com site geo-blocks non-US traffic and returned 403 to every probe in this
  pass, so no endpoint, base URL or machine-readable contract could be verified; the record holds only what was observable.

